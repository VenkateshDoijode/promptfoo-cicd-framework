# Promptfoo Quality Eval Configuration
# Full quality eval – all providers, all test cases. Use on main branch.
# Docs: https://www.promptfoo.dev/docs/configuration/guide
# Author: Venkateshwara Doijode
#
# HOW TO RUN:
#   Linux/Mac:
#     promptfoo eval --config promptfooconfig.yaml \
#       --env-file environments/dev.env \
#       --output reports/json/eval-results-dev.json --no-cache
#
#   Windows (PowerShell):
#     promptfoo eval --config promptfooconfig.yaml `
#       --env-file environments\dev.env `
#       --output reports\json\eval-results-dev.json --no-cache
#
#   View results:
#     promptfoo view

description: "LLM Quality & Regression Eval"

metadata:
  environment: {{env.ENVIRONMENT}}

prompts:
  - "{{question}}"

providers:
  - id: "{{env.EVAL_MODEL_PRIMARY}}"
    label: "GPT-4o (Best)"
    config: &openai_defaults
      systemPrompt: file://prompts/system-prompt.txt
      temperature: 0
      max_tokens: {{env.EVAL_MAX_TOKENS}}
      seed: {{env.EVAL_SEED}}
      timeout: {{env.EVAL_TIMEOUT}}

  - id: "{{env.EVAL_MODEL_SECONDARY}}"
    label: "GPT-4o Mini (Cheap)"
    config:
      <<: *openai_defaults

  - id: "{{env.OPENAI_MODEL_TURBO}}"
    label: "GPT-4 Turbo"
    config:
      <<: *openai_defaults

  - id: "{{env.OPENAI_MODEL_LEGACY}}"
    label: "GPT-3.5 (Baseline)"
    config:
      <<: *openai_defaults

defaultTest:
  options:
    provider: "{{env.JUDGE_MODEL}}"   # cheaper model used as llm-rubric judge

tests:
  - file://testcases/loan_assistant.yaml

evaluateOptions:
  maxConcurrency: {{env.EVAL_CONCURRENCY}}
  repeat: {{env.DEFAULT_REPEAT}}   # run each test case N times for consistency measurement

sharing: false
