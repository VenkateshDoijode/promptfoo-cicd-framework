# Promptfoo Quality Eval Configuration
# Docs: https://www.promptfoo.dev/docs/configuration/guide

description: "LLM Quality & Regression Eval"

prompts:
  - "{{question}}"

providers:
  - id: openai:gpt-4o
    label: "GPT-4o (Best)"
    config:
      systemPrompt: file://prompt/system-prompt.txt
      temperature: 0
      max_tokens: 500
      seed: 42
      timeout: 30000

  - id: openai:gpt-4o-mini
    label: "GPT-4o Mini (Cheap)"
    config:
      systemPrompt: file://prompt/system-prompt.txt
      temperature: 0
      max_tokens: 500
      seed: 42
      timeout: 30000

  - id: openai:gpt-4-turbo
    label: "GPT-4 Turbo"
    config:
      systemPrompt: file://prompt/system-prompt.txt
      temperature: 0
      max_tokens: 500
      seed: 42
      timeout: 30000

  - id: openai:gpt-3.5-turbo
    label: "GPT-3.5 (Baseline)"
    config:
      systemPrompt: file://prompt/system-prompt.txt
      temperature: 0
      max_tokens: 500
      seed: 42
      timeout: 30000

defaultTest:
  options:
    provider: openai:gpt-4o-mini  # cheaper model used as llm-rubric judge

tests:
  - file://tests/test-cases.yaml

sharing: false
