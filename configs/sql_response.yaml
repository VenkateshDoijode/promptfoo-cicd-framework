# SQL Response Evaluation Configuration — SecureBank Internal Data Team
# Author: Venkateshwara Doijode
#
# WHAT IS THIS?
#   Evaluates that the model generates valid, safe PostgreSQL queries.
#   Checks:
#     • Output is valid parseable SQL         (is-sql)
#     • Correct keywords and table refs       (javascript)
#     • No destructive statements             (javascript + python)
#     • Pure SQL output - no markdown         (javascript + python)
#     • Latency and cost within limits        (latency, cost)
#
# HOW TO RUN:
#   Windows (PowerShell – direct):
#     promptfoo eval --config configs\sql_response.yaml `
#       --tests testcases\sql_response.yaml `
#       --env-file environments\dev.env `
#       --output reports\json\sql-response-dev.json --no-cache
#
#   Windows (PowerShell – via script):
#     .\scripts\run_eval.ps1 -Env dev -Config configs\sql_response.yaml `
#       -TestFile testcases\sql_response.yaml
#
#   Linux/Mac:
#     ./scripts/run_eval.sh dev configs/sql_response.yaml testcases/sql_response.yaml
#
#   View results:
#     promptfoo view
# =============================================================================

description: "SQL Response Eval — SecureBank Internal Data Team"

metadata:
  environment: "{{env.ENVIRONMENT}}"

prompts:
  - file://../prompts/sql-prompt.txt

providers:
  - id: "{{env.EVAL_MODEL_PRIMARY}}"
    label: "GPT-4o (SQL)"
    config: &sql_defaults
      temperature: 0
      max_tokens: 300   # literal: promptfoo passes "{{env.*}}" as a STRING; keep in sync with environments/*.env (SQL_MAX_TOKENS)
      seed: 42   # literal: promptfoo passes "{{env.*}}" as a STRING; keep in sync with environments/*.env (EVAL_SEED)
      timeout: 30000   # literal: promptfoo passes "{{env.*}}" as a STRING; keep in sync with environments/*.env (EVAL_TIMEOUT)

  - id: "{{env.EVAL_MODEL_SECONDARY}}"
    label: "GPT-4o Mini (SQL)"
    config:
      <<: *sql_defaults

defaultTest:
  options:
    provider: "{{env.JUDGE_MODEL}}"   # judge model for llm-rubric assertions

  assert:
    - type: is-sql                    # every response must be valid SQL
    - type: latency
      threshold: 8000   # literal: promptfoo passes "{{env.*}}" as a STRING; keep in sync with environments/*.env (SQL_LATENCY_THRESHOLD_MS)
    - type: cost
      threshold: 0.003   # literal: promptfoo passes "{{env.*}}" as a STRING; keep in sync with environments/*.env (SQL_COST_THRESHOLD_USD)

evaluateOptions:
  maxConcurrency: 5   # literal: promptfoo passes "{{env.*}}" as a STRING; keep in sync with environments/*.env (EVAL_CONCURRENCY)
  # repeat: pass --repeat per run (scripts/run_eval.* pass DEFAULT_REPEAT from the env file)

sharing: false
