# Promptfoo Red Team Configuration — PII & Fraud Safety
# Targeted quick scan for PII leakage and fraud-related risks.
# Use on every PR / merge request gate.
# Docs: https://www.promptfoo.dev/docs/red-team/
# Author: Venkateshwara Doijode

# HOW TO RUN:
#   Provider is set dynamically via REDTEAM_PROVIDER in environments/*.env
#
#   | Environment | Provider (REDTEAM_PROVIDER) |
#   |-------------|-----------------------------|
#   | dev         | openai:gpt-4o                |
#   | uat         | openai:gpt-4o                |
#   | prod        | anthropic:claude-3-5-sonnet-20241022 |
#
# Linux/Mac:
#   # dev (PR gate)
#   promptfoo redteam run --config compliance/redteam_pii_fraud.yaml \
#     --env-file environments/dev.env \
#     --output reports/json/redteam-pii-fraud-dev.json --no-cache
#
#   # prod (PR gate)
#   promptfoo redteam run --config compliance/redteam_pii_fraud.yaml \
#     --env-file environments/prod.env \
#     --output reports/json/redteam-pii-fraud-prod.json --no-cache
#
# Windows (PowerShell):
#   promptfoo redteam run --config compliance\redteam_pii_fraud.yaml `
#     --env-file environments\dev.env `
#     --output reports\json\redteam-pii-fraud-dev.json --no-cache
#
# View results after run:
#   promptfoo view

description: "LLM Red Team / PII & Fraud Safety (PR Gate)"

metadata:
  environment: "{{env.ENVIRONMENT}}"

redteam:
  # The target system under test
  purpose: "A banking assistant that handles customer queries. Must never leak PII or assist with fraud."

  # Number of attack attempts per plugin (set REDTEAM_NUM_TESTS in your env file)
  numTests: {{env.REDTEAM_NUM_TESTS}}

  # Targeted plugins for PII and fraud safety
  plugins:
    - pii:direct       # Direct PII extraction
    - pii:indirect     # Indirect PII leakage
    - prompt-injection # Prompt injection attacks
    - jailbreak        # General jailbreak attempts

  # Attack strategies to use
  strategies:
    - jailbreak        # Multi-turn jailbreak
    - prompt-injection # Injected instructions in user input

  providers:
    # Provider is controlled via REDTEAM_PROVIDER env var — set in environments/*.env
    # Examples: anthropic:claude-3-5-sonnet-20241022 | openai:gpt-4o-mini
    - id: "{{env.REDTEAM_PROVIDER}}"
      config:
        systemPrompt: file://prompts/system-prompt.txt
        temperature: 0

  # sharing: false — results stay local only, never uploaded to promptfoo.dev cloud.
  # Required for banking/compliance use cases (RBI, GDPR).
  sharing: false
