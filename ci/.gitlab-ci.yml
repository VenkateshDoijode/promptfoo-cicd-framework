# .gitlab-ci.yml — Promptfoo LLM Evaluation Pipeline (UAT)
# Author: Venkateshwara Doijode
#
# PIPELINE STAGES:
#   1. pr-check    — regression + functional assertions (blocks merge to uat branch)
#   2. uat-eval     — full test suite on merge to uat branch
#
# VARIABLES (set in GitLab → Settings → CI/CD → Variables):
#   ANTHROPIC_API_KEY          — Anthropic API key (masked)
#   OPENAI_API_KEY             — OpenAI API key (masked)
#   AZURE_OPENAI_API_KEY       — Azure OpenAI API key (masked)
#   AZURE_OPENAI_API_HOST      — Azure OpenAI host URL (masked)
#   AZURE_OPENAI_DEPLOYMENT_ID — Azure deployment name
#   LOAN_API_KEY               — SecureBank internal API key (masked)
# ====================================================================

variables:
  PROMPTFOO_VERSION: "0.97.0"        # update here when upgrading promptfoo
  NODE_IMAGE: node:20-slim           # update here when upgrading Node.js base image
  CI_ENV_NAME: "uat"                 # logical environment name written into ci.env
  ARTIFACT_EXPIRE_PR: "7 days"       # artifact retention for PR check jobs
  ARTIFACT_EXPIRE_UAT: "14 days"     # artifact retention for UAT eval jobs

  # Per-job quality gate thresholds — override in GitLab CI/CD project variables if needed
  REGRESSION_FAIL_THRESHOLD: "0.9"
  REGRESSION_REPEAT: "1"
  FUNCTIONAL_FAIL_THRESHOLD: "0.85"
  FUNCTIONAL_REPEAT: "1"
  SMOKE_FAIL_THRESHOLD: "0.95"
  SMOKE_REPEAT: "2"
  BUSINESS_RULES_FAIL_THRESHOLD: "0.95"
  BUSINESS_RULES_REPEAT: "2"
  REGRESSION_FULL_FAIL_THRESHOLD: "0.9"
  REGRESSION_FULL_REPEAT: "2"

default:
  image: ${NODE_IMAGE}
  before_script:
    - npm install -g promptfoo@${PROMPTFOO_VERSION}
    - pip3 install -r requirements.txt --quiet --break-system-packages   # required for Python validators (bleu/rouge/meteor/bert_score); --break-system-packages
    - chmod +x scripts/run_eval.sh
    - |
      # Base ci.env from uat.env (carries all model/inference/threshold vars)
      # then override with real secrets so placeholders are never used.
      cp environments/uat.env environments/ci.env
      cat >> environments/ci.env <<EOF
      ENVIRONMENT=${CI_ENV_NAME}
      ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      OPENAI_API_KEY=${OPENAI_API_KEY}
      AZURE_OPENAI_API_KEY=${AZURE_OPENAI_API_KEY}
      AZURE_OPENAI_API_HOST=${AZURE_OPENAI_API_HOST}
      AZURE_OPENAI_DEPLOYMENT_ID=${AZURE_OPENAI_DEPLOYMENT_ID}
      LOAN_API_KEY=${LOAN_API_KEY}
      OUTPUT_DIR=reports/json
      EOF
    - mkdir -p reports/json

stages:
  - pr-check
  - uat-eval

# ============================================================================
# Stage 1 — PR Check
# Runs on every merge request targeting the uat branch
# Blocks merge if regression or functional assertions fail
# ============================================================================

regression-check:
  stage: pr-check
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event" && $CI_MERGE_REQUEST_TARGET_BRANCH_NAME == "uat"'
  variables:
    FAIL_THRESHOLD: $REGRESSION_FAIL_THRESHOLD
    DEFAULT_REPEAT: $REGRESSION_REPEAT
  script:
    - |
      echo "FAIL_THRESHOLD=${FAIL_THRESHOLD}" >> environments/ci.env
      echo "DEFAULT_REPEAT=${DEFAULT_REPEAT}" >> environments/ci.env
      ./scripts/run_eval.sh ci configs/claude.yaml assertions/regression.yaml
  artifacts:
    when: always
    paths:
      - reports/json/
    expire_in: ${ARTIFACT_EXPIRE_PR}

functional-check:
  stage: pr-check
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event" && $CI_MERGE_REQUEST_TARGET_BRANCH_NAME == "uat"'
  variables:
    FAIL_THRESHOLD: $FUNCTIONAL_FAIL_THRESHOLD
    DEFAULT_REPEAT: $FUNCTIONAL_REPEAT
  script:
    - |
      echo "FAIL_THRESHOLD=${FAIL_THRESHOLD}" >> environments/ci.env
      echo "DEFAULT_REPEAT=${DEFAULT_REPEAT}" >> environments/ci.env
      ./scripts/run_eval.sh ci configs/claude.yaml assertions/functional.yaml
  artifacts:
    when: always
    paths:
      - reports/json/
    expire_in: ${ARTIFACT_EXPIRE_PR}

# ============================================================================
# Stage 2 — UAT Eval
# Runs on push/merge to uat branch (not merge requests)
# Full test suite — smoke, business rules, regression, RAG
# ============================================================================

smoke-test:
  stage: uat-eval
  rules:
    - if: '$CI_COMMIT_BRANCH == "uat" && $CI_PIPELINE_SOURCE != "merge_request_event"'
  variables:
    FAIL_THRESHOLD: $SMOKE_FAIL_THRESHOLD
    DEFAULT_REPEAT: $SMOKE_REPEAT
  script:
    - |
      echo "FAIL_THRESHOLD=${FAIL_THRESHOLD}" >> environments/ci.env
      echo "DEFAULT_REPEAT=${DEFAULT_REPEAT}" >> environments/ci.env
      ./scripts/run_eval.sh ci configs/claude.yaml testcases/smoke_test_case.yaml
  artifacts:
    when: always
    paths:
      - reports/json/
    expire_in: ${ARTIFACT_EXPIRE_UAT}

business-rules:
  stage: uat-eval
  rules:
    - if: '$CI_COMMIT_BRANCH == "uat" && $CI_PIPELINE_SOURCE != "merge_request_event"'
  variables:
    FAIL_THRESHOLD: $BUSINESS_RULES_FAIL_THRESHOLD
    DEFAULT_REPEAT: $BUSINESS_RULES_REPEAT
  script:
    - |
      echo "FAIL_THRESHOLD=${FAIL_THRESHOLD}" >> environments/ci.env
      echo "DEFAULT_REPEAT=${DEFAULT_REPEAT}" >> environments/ci.env
      ./scripts/run_eval.sh ci configs/claude.yaml compliance/business_rules.yaml
  environment:
    name: uat
  artifacts:
    when: always
    paths:
      - reports/json/
    expire_in: ${ARTIFACT_EXPIRE_UAT}

regression-full:
  stage: uat-eval
  rules:
    - if: '$CI_COMMIT_BRANCH == "uat" && $CI_PIPELINE_SOURCE != "merge_request_event"'
  variables:
    FAIL_THRESHOLD: $REGRESSION_FULL_FAIL_THRESHOLD
    DEFAULT_REPEAT: $REGRESSION_FULL_REPEAT
  script:
    - |
      echo "FAIL_THRESHOLD=${FAIL_THRESHOLD}" >> environments/ci.env
      echo "DEFAULT_REPEAT=${DEFAULT_REPEAT}" >> environments/ci.env
      ./scripts/run_eval.sh ci configs/claude.yaml assertions/regression.yaml
  artifacts:
    when: always
    paths:
      - reports/json/
    expire_in: ${ARTIFACT_EXPIRE_UAT}
