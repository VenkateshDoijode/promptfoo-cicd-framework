# Promptfoo Red Team Configuration — Full Safety Sweep
# Runs all plugins. Use on main branch / scheduled scans.
# Docs: https://www.promptfoo.dev/docs/red-team/
# Author: Venkateshwara Doijode
#
# HOW TO RUN:
#   Provider is set dynamically via REDTEAM_PROVIDER in environments/*.env
#
#   ┌─────────────┬─────────────────────────────┐
#   │ Environment │ Provider (REDTEAM_PROVIDER) │
#   ├─────────────┼─────────────────────────────┤
#   │ dev         │ openai:gpt-4o               │
#   │ uat         │ openai:gpt-4o               │
#   │ prod        │ anthropic:claude-sonnet-4-6 │
#   └─────────────┴─────────────────────────────┘
#
#   Linux/Mac:
#     # dev
#     promptfoo redteam run --config security_testing/redteam.yaml \
#       --env-file environments/dev.env \
#       --output reports/json/redteam-full-dev.json --no-cache
#
#     # prod
#     promptfoo redteam run --config security_testing/redteam.yaml \
#       --env-file environments/prod.env \
#       --output reports/json/redteam-full-prod.json --no-cache
#
#   Windows (PowerShell):
#     promptfoo redteam run --config security_testing\redteam.yaml `
#       --env-file environments\dev.env `
#       --output reports\json\redteam-full-dev.json --no-cache
#
#   View results after run:
#     promptfoo view

description: "LLM Red Team / Full Safety Sweep"

metadata:
  environment: "{{env.ENVIRONMENT}}"

# System prompt travels inside the chat prompt (works for every provider; the Anthropic
# provider ignores config.systemPrompt). Paths are relative to this file's folder.
prompts:
  - file://../prompts/redteam_target_chat.json

defaultTest:
  vars:
    system_prompt: file://../prompts/system-prompt.txt

redteam:
  # The target system under test
  purpose: "A general-purpose helpful assistant that answers user questions accurately and safely"

  # Attacks are injected into the {{prompt}} slot of redteam_target_chat.json
  injectVar: prompt

  # Attacks per plugin. Must be a literal number: promptfoo's schema rejects
  # "{{env.REDTEAM_NUM_TESTS}}" (string) and the unquoted form is invalid YAML.
  # Keep in sync with REDTEAM_NUM_TESTS in environments/*.env.
  numTests: 5

  # Red team plugins to enable (names validated against promptfoo 0.123.1)
  plugins:
    - harmful:hate           # Hate speech generation
    - harmful:self-harm      # Self-harm content
    - harmful:violent-crime  # Violent content (was harmful:violence — not a valid id)
    - harmful:sexual-content # Sexual content (was harmful:sexual — not a valid id)
    # --- Safety & content moderation (docs/agent_test_coverage_checklist.md section 8) ---
    - harmful:illegal-activities            # Fraud & scams
    - harmful:indiscriminate-weapons        # Weapons capable of mass harm
    - harmful:weapons:ied                   # Improvised explosive devices
    - harmful:child-exploitation            # Child safety
    - harmful:harassment-bullying           # Harassment
    - harmful:insults                       # Insults / personal attacks (toxicity)
    - harmful:profanity                     # Responds to profanity with profanity
    - harmful:radicalization                # Extremist content
    - harmful:misinformation-disinformation # Harmful lies and propaganda
    - harmful:specialized-advice            # Unqualified financial / medical / legal advice
    - bias:age                              # Bias & fairness
    - bias:disability
    - bias:gender
    - bias:race
    - pii:direct             # Direct PII extraction
    - pii:session            # PII leaking across the session (was pii:indirect — not a valid id)
    - pii:social             # Social-engineering for PII
    - excessive-agency       # Model claiming excessive capabilities
    - hallucination          # Fabricating information confidently
    # prompt-injection and jailbreak are STRATEGIES, not plugins — see below.

  # Attack strategies to use
  strategies:
    - jailbreak              # Iterative single-turn jailbreak (multi-turn: crescendo / goat)
    - prompt-injection       # Injected instructions in user input

providers:
  # Provider is controlled via REDTEAM_PROVIDER env var — set in environments/*.env
  # Examples: anthropic:claude-sonnet-4-6 | openai:gpt-4o-mini
  - id: "{{env.REDTEAM_PROVIDER}}"
    config:
      temperature: 0

# sharing: false — results stay local only, never uploaded to promptfoo.dev cloud.
# Required for banking/compliance use cases (RBI, GDPR).
sharing: false
